name: SwiftUI boundary

on:
  push:
    branches: 
    - develop
    - feature/*

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Verify dependency-free project boundary
      run: |
        ruby scripts/verify-pod-linkage-boundary.rb
        ruby scripts/verify-tracked-swift-source-boundary.rb
    - name: Build tests for the iOS Simulator
      run: >-
        xcodebuild build-for-testing
        -project MissCat.xcodeproj
        -scheme MissCat
        -destination 'generic/platform=iOS Simulator'
        CODE_SIGNING_ALLOWED=NO
